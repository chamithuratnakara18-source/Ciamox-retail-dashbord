<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · RetailFlow</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#192c36;background:#f3f7f6}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 85% 0,#e1f5ec,transparent 48%),#f3f7f6}
    main{width:min(100%,420px);background:#fff;border:1px solid #e3ebe8;border-radius:20px;padding:32px;box-shadow:0 22px 65px #12322512}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#172936;color:#65dca5}
    h1{font-size:27px;letter-spacing:-.04em;margin:35px 0 6px}p{color:#71818a;font-size:14px;line-height:1.5;margin:0 0 25px}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #dce5e2;border-radius:9px;font:inherit;outline:none}
    input:focus{border-color:#26b781;box-shadow:0 0 0 3px #26b78122}button{margin-top:16px;width:100%;border:0;border-radius:9px;padding:13px;background:#1eaf7c;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}#message{min-height:22px;margin:13px 0 0;color:#b34334;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">R</span> RetailFlow</div>
    <h1>Sign in</h1>
    <p>Enter the store password to open the dashboard and scanner.</p>
    <form id="loginForm">
      <label for="password">Store password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Sign in</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get('next') === '/scanner.html' ? '/scanner.html' : '/';
    const message = document.getElementById('message');
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submit');
    fetch('/api/auth/status', { cache: 'no-store' }).then(response => {
      if (response.ok) location.replace(next);
    }).catch(() => {});
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `Sign in failed (${response.status}).`);
        location.replace(next);
      } catch (error) {
        message.textContent = error.message || 'Unable to sign in.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
